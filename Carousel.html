<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="keywords" content="portfolio, UX, Design, Xiaotong Du, SCAD, portfolio website, Interaction Design, UX Designer">
 <meta name="author" content="Xiaotong Du">
 <link rel="icon" type="image/png" href="assets/images/favicon.png" alt="xiaotongdu XD LOGO favicon">
 <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
  <meta name="description" content="Xiaotong Du, SCAD Interactive Design Graduate Candidate. UX Designer Projects">

<!-- START: Styles -->
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css?family=Playfair+Display:400,400i,700,700i%7cWork+Sans:400,500,700" rel="stylesheet" type="text/css">
<link rel="stylesheet" href="assets/css/combined.css">
<link href="css/bootstrap.css" rel="stylesheet" type="text/css">
<link href="assets/css/carousel.css" rel="stylesheet" type="text/css">
<!-- END: Styles -->

<!--title-font-color:  #445469-->

<!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->

<!--[if lt IE 9]>
<script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>

<![endif]-->
</head>
<body>

<div class="container" id="we-sketch-carousel">
  <h2>Sketch</h2>  
  <div id="myCarousel" class="carousel slide" data-ride="carousel">
    <!-- Indicators -->
    <ol class="carousel-indicators">
      <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
      <li data-target="#myCarousel" data-slide-to="1"></li>
      <li data-target="#myCarousel" data-slide-to="2"></li>
      <li data-target="#myCarousel" data-slide-to="3"></li>
      <li data-target="#myCarousel" data-slide-to="4"></li>
      <li data-target="#myCarousel" data-slide-to="5"></li>
      <li data-target="#myCarousel" data-slide-to="6"></li>
      <li data-target="#myCarousel" data-slide-to="7"></li>
      <li data-target="#myCarousel" data-slide-to="8"></li>
    </ol>

    <!-- Wrapper for slides -->
    <div class="carousel-inner">
      <div class="item active">
        <img src="assets/images/we-easy/sketch01.jpg" alt="we easy sketch" style="width:100%;">
      </div>

      <div class="item">
        <img src="assets/images/we-easy/sketch02.jpg" alt="we easy sketch" style="width:100%;" >
      </div>
     
       <div class="item">
        <img src="assets/images/we-easy/sketch03.jpg" alt="we easy sketch" style="width:100%;">
      </div>
      
       <div class="item">
        <img src="assets/images/we-easy/sketch04.jpg" alt="we easy sketch" style="width:100%;">
      </div>
       <div class="item">
        <img src="assets/images/we-easy/sketch05.jpg" alt="we easy sketch" style="width:100%;">
      </div>
       <div class="item">
        <img src="assets/images/we-easy/sketch06.jpg" alt="we easy sketch" style="width:100%;">
      </div>
       <div class="item">
        <img src="assets/images/we-easy/sketch07.jpg" alt="we easy sketch" style="width:100%;">
      </div>
     
    </div>

    <!-- Left and right controls -->
    <a class="left carousel-control" href="#myCarousel" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="right carousel-control" href="#myCarousel" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>
</div>

</body>
</html>
